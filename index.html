      else if (dino.coyoteTime > 0) dino.coyoteTime -= dt;
      if (keys['z'] && dino.coyoteTime > 0) {
        dino.vz = JUMP_FORCE;
        dino.onGround = false;
        dino.coyoteTime = 0;
      }
      const prevHeight = dino.height;
      dino.vz -= GRAVITY * dt;
      dino.height += dino.vz * dt;

      // Does he land on a beam or on the forest floor?
      const floorZ = floorBelow(dino.x, dino.y, prevHeight);
      if (dino.height <= floorZ) {
        dino.height = floorZ;
        dino.vz = 0;
        dino.onGround = true;
      } else {
        dino.onGround = false;
      }

      // Captured? Then you can't get past the boulder. You can still throw,
      // and that's exactly how you break free.
      if (captured) {
        dino.y = Math.min(dolmen.y + DOLMEN.front - DOLMEN.thick - 6, dino.y);
      }

      // Into the cave at the top of the beams: on to the next level
      if (!captured && !won && cave && Math.abs(dino.x - cave.x) < 60
          && Math.abs(dino.y - cave.y) < 55 && dino.height > cave.z - 45) {
        if (level >= LEVEL_COUNT) {
          // That was the last level: party on the dance floor
          won = true;
          levelText = 'All 30 levels done!';
          levelTextTime = 6;
          dino.x = world.width / 2;
          dino.y = groundY + 80;
          dino.height = 0;
          dino.vz = 0;
          camera.x = Math.max(0, Math.min(world.width - canvas.width, dino.x - canvas.width / 2));
          return;
        }
        level += 1;
        levelText = level >= LEVEL_COUNT ? 'DISCO LEVEL!' : 'Level ' + level + '!';
        levelTextTime = 2.5;
        shots = [];
        puffs = [];
        captured = false;
        rebuild();
        dino.x = start.x;
        dino.y = start.y;
        dino.height = 0;
        dino.vz = 0;
        dino.onGround = true;
        camera.x = Math.max(0, Math.min(world.width - canvas.width, dino.x - canvas.width / 2));
        return;
      }

      // The space bar throws your weapon, unless you just threw it
      if (throwCooldown > 0) throwCooldown -= dt;
      if (keys[' '] && heldWeapon && throwCooldown <= 0) {
        const direction = dino.facesRight ? 1 : -1;
        const scale = dinoScale() * 0.75;
        shots.push({
          kind: heldWeapon.kind === 'bow' ? 'arrow' : heldWeapon.kind,
          x: dino.x + direction * 24 * scale,
          y: dino.y,
          height: 17 * dinoScale() + dino.height,   // how high above the ground it flies
          direction: direction,
          speed: heldWeapon.speed,
          scale: scale,
          spin: 0,
          distance: 0,
        });
        throwCooldown = heldWeapon.cooldown;
      }

      // Move everything that's flying a bit further along
      for (const shot of shots) {
        shot.x += shot.direction * shot.speed * dt;
        shot.distance += shot.speed * dt;
        shot.spin += dt * 16;
        // Does it hit a guard? Two hits and he goes down.
        for (const guard of guards) {
          if (guard.defeated || guard.flinch > 0) continue;
          if (Math.abs(shot.x - guard.x) < 30 && Math.abs(shot.y - guard.y) < 50) {
            guard.health -= 1;
            guard.flinch = 0.35;
            guard.x += shot.direction * 10;          // he staggers back
            puffs.push({ x: shot.x, y: shot.y, age: 0 });
            shot.gone = true;
            if (guard.health <= 0) {
              guard.defeated = true;
              guard.fallTime = 1.1;
            }
          }
        }

        // Does it hit a hunter or a dog? They get the fright of their life and run off.
        for (const hunter of hunters) {
          if (hunter.scaredTime <= 0 && Math.abs(shot.x - hunter.x) < 28 && Math.abs(shot.y - hunter.y) < 26) {
            hunter.scaredTime = 5;
            hunter.dogScaredTime = 5;
            puffs.push({ x: shot.x, y: shot.y, age: 0 });
            shot.gone = true;
          }
          if (hunter.dogScaredTime <= 0 && Math.abs(shot.x - hunter.dogX) < 24 && Math.abs(shot.y - hunter.dogY) < 22) {
            hunter.dogScaredTime = 5;
            puffs.push({ x: shot.x, y: shot.y, age: 0 });
            shot.gone = true;
          }
        }

        // Does it hit a rock, log or stump? Then it stops there.
        if (hitsObstacle(shot.x, shot.y)) {
          puffs.push({ x: shot.x, y: shot.y, age: 0 });
          shot.gone = true;
        }
        // Out of the world or flown too far: clean it up
        if (shot.x < -60 || shot.x > world.width + 60 || shot.distance > 900) shot.gone = true;
      }
      shots = shots.filter(function (shot) { return !shot.gone; });

      // Drifting leaves sink down and start over at the top
      for (const leaf of fallingLeaves) {
        leaf.y += leaf.fallSpeed * dt;
        if (leaf.y > canvas.height + 20) {
          leaf.y = -20;
          leaf.x = camera.x + Math.random() * canvas.width;
        }
      }

      for (const puff of puffs) puff.age += dt;
      puffs = puffs.filter(function (puff) { return puff.age < 0.4; });

      // Pick up coins he walks past
      for (const coin of coins) {
        if (coin.collected) continue;
        if (Math.abs(dino.x - coin.x) < 26 && Math.abs(dino.y - coin.y) < 20
            && Math.abs(dino.height - (coin.height || 0)) < 45) {
          coin.collected = true;
          coinCount += 1;
        }
      }

      // He stays on the forest floor and inside the world
      const margin = 30 * dinoScale();
      dino.x = Math.min(world.width - margin, Math.max(margin, dino.x));
      dino.y = Math.min(canvas.height - 10, Math.max(groundY + 6, dino.y));

      // The camera keeps the dino centered, but stops at the edge of the world
      const target = dino.x - canvas.width / 2;
      camera.x = Math.max(0, Math.min(world.width - canvas.width, target));
    }

    // Draws the baby dino with (0, 0) at his feet, in his own small units.
    function drawDino() {
      // Tail
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.moveTo(-8, -14);
      ctx.quadraticCurveTo(-26, -10, -22, -2);
      ctx.quadraticCurveTo(-14, -6, -6, -8);
      ctx.closePath();
      ctx.fill();

      // Legs and feet: while walking they swing forward in turn
      const swing = dino.walking ? Math.sin(dino.step) * 4 : 0;
      const raise = dino.walking ? Math.max(0, Math.sin(dino.step)) * 2 : 0;
      const swing2 = dino.walking ? Math.sin(dino.step + Math.PI) * 4 : 0;
      const raise2 = dino.walking ? Math.max(0, Math.sin(dino.step + Math.PI)) * 2 : 0;

      ctx.fillStyle = '#4aa83c';
      ctx.fillRect(-7 + swing, -8, 5, 8 - raise);
      ctx.fillRect(2 + swing2, -8, 5, 8 - raise2);

      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(-9 + swing, -2 - raise, 8, 2);
      ctx.fillRect(1 + swing2, -2 - raise2, 8, 2);

      // Body
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(0, -16, 11, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Belly
      ctx.fillStyle = '#c8ef9a';
      ctx.beginPath();
      ctx.ellipse(1, -13, 7, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(4, -30, 10, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Snout
      ctx.beginPath();
      ctx.ellipse(12, -28, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Nostril
      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(14, -30, 1, 1);

      // Eye: a quick blink every few seconds
      const blinking = (dino.time % 3) > 2.85;
      ctx.fillStyle = '#222';
      if (blinking) {
        ctx.fillRect(4, -31, 4, 1);
      } else {
        ctx.beginPath();
        ctx.arc(6, -31, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6.7, -31.7, 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Little crest on his head
      ctx.fillStyle = '#f5d24a';
      ctx.beginPath();
      ctx.moveTo(0, -37);
      ctx.lineTo(3, -42);
      ctx.lineTo(5, -37);
      ctx.closePath();
      ctx.fill();

      // Back plates
      ctx.fillStyle = '#f5d24a';
      for (const [x, y, h] of [[-4, -24, 4], [-9, -21, 3], [-13, -18, 2]]) {
        ctx.beginPath();
        ctx.moveTo(x - 2, y);
        ctx.lineTo(x, y - h);
        ctx.lineTo(x + 2, y);
        ctx.closePath();
        ctx.fill();
      }

      // Little arm
      ctx.fillStyle = '#4aa83c';
      ctx.beginPath();
      ctx.ellipse(8, -18, 4, 2.5, -0.4, 0, Math.PI * 2);
      ctx.fill();

      // He holds the bought weapon in front of him
      if (heldWeapon) {
        ctx.save();
        ctx.translate(7, -17);
        ctx.rotate(-0.12);
        ctx.scale(0.8, 0.8);
        drawWeapon(heldWeapon);
        ctx.restore();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawJungle(dino.time);

      // Standing still he breathes softly, walking he bobs in rhythm with his steps.
      const bob = dino.walking
        ? Math.abs(Math.sin(dino.step)) * -4
        : (disco ? -Math.abs(Math.sin(beatAt(dino.time) * Math.PI)) * 9 : Math.sin(dino.time * 2) * 3);

      const size = dinoScale();

      // Everything in the world scrolls with the camera.
      ctx.save();
      ctx.translate(-camera.x, 0);

      // Is this bit of the world on screen? If not, there's no need to draw it.
      function onScreen(x) {
        return x > camera.x - 160 && x < camera.x + canvas.width + 160;
      }

      // Things further forward get drawn later, so they appear in front.
      const layers = [];
      for (const o of obstacles) {
        if (!onScreen(o.x)) continue;
        layers.push({ y: o.y, draw: function () {
          const scale = o.scale * (1.3 + (o.y - groundY) / Math.max(1, canvas.height - groundY));
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.scale(scale, scale);
          drawObstacle(o);
          ctx.restore();
        } });
      }
      // The dolmen: the back stones first, the front stones later, so you
      // really stand between them when you're captured.
      if (dolmen && onScreen(dolmen.x)) {
        layers.push({ y: dolmen.y + DOLMEN.back - 10, draw: function () {
          ctx.save();
          ctx.translate(dolmen.x, dolmen.y);
          drawDolmen(false);
          ctx.restore();
        } });
        layers.push({ y: dolmen.y + DOLMEN.front, draw: function () {
          ctx.save();
          ctx.translate(dolmen.x, dolmen.y);
          drawDolmen(true);
          ctx.restore();
        } });
      }

      // The two guards at the entrance
      for (const guard of guards) {
        if (!onScreen(guard.x)) continue;
        layers.push({ y: guard.y, draw: function () {
          const scale = scaleAtDepth(guard.y) * 1.05;
          ctx.save();
          ctx.translate(guard.x, guard.y + danceBob);
          ctx.scale(guard.facesRight ? scale : -scale, scale);
          drawGuard(guard, dino.time);
          ctx.restore();
        } });
      }

      // In the disco everyone bobs along to the beat
      const danceBob = disco ? -Math.abs(Math.sin(beatAt(dino.time) * Math.PI)) * 10 : 0;

      // People with dogs
      for (const hunter of hunters) {
        if (onScreen(hunter.x)) {
          layers.push({ y: hunter.y, draw: function () {
            const scale = scaleAtDepth(hunter.y) * 0.95;
            ctx.save();
            ctx.translate(hunter.x, hunter.y + danceBob);
            ctx.scale(hunter.facesRight ? scale : -scale, scale);
            drawHunter(hunter);
            ctx.restore();
          } });
        }
        if (onScreen(hunter.dogX)) {
          layers.push({ y: hunter.dogY, draw: function () {
            const scale = scaleAtDepth(hunter.dogY) * 0.95;
            ctx.save();
            ctx.translate(hunter.dogX, hunter.dogY + danceBob * 0.6);
            ctx.scale(hunter.dogFacesRight ? scale : -scale, scale);
            drawDog(hunter);
            ctx.restore();
          } });
        }
      }

      // The cave is far back, so it comes early in the order
      if (cave && onScreen(cave.x)) {
        layers.push({ y: cave.y - 1, draw: function () { drawCave(dino.time); } });
      }
      if (lift && onScreen(lift.x)) {
        layers.push({ y: lift.y, draw: function () {
          ctx.save();
          ctx.translate(lift.x, lift.y);
          drawLift(dino.time);
          ctx.restore();
        } });
      }
      if (sign && onScreen(sign.x)) {
        layers.push({ y: sign.y, draw: function () {
          const scale = scaleAtDepth(sign.y) * 0.5;
          ctx.save();
          ctx.translate(sign.x, sign.y);
          ctx.scale(scale, scale);
          drawSign();
          ctx.restore();
        } });
      }
      for (const beam of beams) {
        if (!onScreen(beam.x)) continue;
        layers.push({ y: beam.y, draw: function () {
          ctx.save();
          ctx.translate(beam.x, beam.y);
          drawBeam(beam);
          ctx.restore();
        } });
      }
      for (const coin of coins) {
        if (coin.collected || !onScreen(coin.x)) continue;
        layers.push({ y: coin.y, draw: function () { drawCoin(coin, dino.time); } });
      }
      for (const shot of shots) {
        layers.push({ y: shot.y + 1, draw: function () { drawShot(shot); } });
      }
      // When you're on a beam, you should be drawn just in front of it.
      layers.push({ y: dino.y + (dino.height > 0 ? 25 : 0), draw: function () {
        // Shadow on the forest floor, smaller the higher he is
        if (dino.height > 2) {
          ctx.save();
          ctx.globalAlpha = Math.max(0.1, 0.32 - dino.height / 1400);
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.ellipse(dino.x, dino.y, 11 * size, 3.5 * size, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.translate(dino.x, dino.y + bob - dino.height);
        ctx.scale(dino.facesRight ? size : -size, size);
        drawDino();
        ctx.restore();
      } });
      layers.sort(function (a, b) { return a.y - b.y; });
      for (const item of layers) item.draw();

      for (const puff of puffs) drawPuff(puff);

      drawForeground(dino.time);
      drawButterflies(dino.time);
      drawFallingLeaves(dino.time);
      ctx.restore();

      drawVignette();

      drawCounter();
      drawMinimap();
      drawHelp();
      if (captured) drawCapturedText();
      if (levelTextTime > 0) drawLevelText();
      if (won) drawVictory(dino.time);
      drawShopButton();
      if (shopOpen) drawShop();
    }

    rebuild();
    dino.x = start.x;
    dino.y = start.y;
    camera.x = Math.max(0, Math.min(world.width - canvas.width, dino.x - canvas.width / 2));

    let lastTime = performance.now();
    function loop(now) {
      update((now - lastTime) / 1000);
      lastTime = now;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
